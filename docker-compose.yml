services:
  mongo:
    image: mongo:7
    container_name: nexusync-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nexusync}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: nexusync
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-nexusync}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: nexusync
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # "true" quando o site é servido por HTTPS (recomendado em produção)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Sem porta publicada: o Traefik (Dokploy) acessa pela rede interna.
    # Para rodar localmente, use um docker-compose.override.yml com ports.
    expose:
      - "3000"

volumes:
  mongo_data:
